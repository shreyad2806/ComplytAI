services:
  - type: web
    name: complyt-ai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CREWAI_MODEL
        value: gemini/gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
